<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Your simple note-taking companion.</p>
    </header>

    <main>

        <section class="section-add">
            <h2>Add a note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Note</label>
                    <input
                        type="text"
                        id="note-input"
                        placeholder="Write your note here..."
                        maxlength="300"
                    />
                </div>

                <div class="form-group">
                    <label for="note-category">Category</label>
                    <select id="note-category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit">Add Note</button>
                    <button type="button" id="clear-all-btn">Clear All</button>
                </div>

                <p id="error-message"></p>
            </form>
        </section>

        <section class="section-notes">
        <h2>Your notes</h2>

        <div class="search-bar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search notes..."
                />
        </div>

            <p id="note-count">You have no notes yet.</p>
            <ul id="notes-list"></ul>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 QuickNotes — Keep it simple.</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
